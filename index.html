</style></head><body><main id="app"></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), view=location.pathname.slice(1)||'host', app=document.querySelector('#app');
let selfieData=null,profileCode=null,statsOpen=false;
let state=null,myId=localStorage.getItem('kq-id'),chosen=null,submitted=false,hostKey=sessionStorage.getItem('hostKey')||'',tick;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=p=>p.avatar?'<img class="player-avatar" src="'+esc(p.avatar)+'" alt="Selfie von '+esc(p.name)+'">':'<span class="player-avatar avatar-fallback">🙂</span>';
const ranking=()=>'<ol>'+state.players.map(p=>'<li class="rank-player">'+avatar(p)+'<span class="rank-name">'+esc(p.name)+'</span><b>'+p.score+' Punkte</b></li>').join('')+'</ol>';
const opts=q=>q.options?.map((o,i)=>'<button class="option '+((Array.isArray(chosen)?chosen.includes(i):chosen===i)?'selected':'')+'" onclick="choose('+i+')">'+esc(o)+'</button>').join('')||'';
window.choose=i=>{if(submitted)return;chosen=state.question.type==='multi'?(Array.isArray(chosen)?chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i]:[i]):i;render()};
window.move=(i,delta)=>{const arr=chosen;const j=i+delta;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];render()};
window.send=()=>{const q=state.question;if(q.type==='sudoku')chosen=q.grid.map((row,r)=>row.map((v,c)=>v||Number(document.querySelector('[data-cell="'+r+'-'+c+'"]')?.value||0)));if(['estimate','text'].includes(q.type))chosen=document.querySelector('#answer')?.value;if(q.type==='boolean')chosen=chosen===true||chosen===false?chosen:null;if(chosen===null||chosen===''||(Array.isArray(chosen)&&!chosen.length))return;socket.emit('answer',chosen,r=>{if(r?.ok){submitted=true;render()}})};
window.host=type=>socket.emit('host',{type,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.setKidsMode=enabled=>{if(confirm('Spielmodus wechseln? Die laufende Runde und alle Punkte werden zurückgesetzt.'))socket.emit('host',{type:'kidsMode',enabled,key:hostKey},r=>{if(r?.error)alert(r.error)});else render()};
window.setLeaderboard=visible=>socket.emit('host',{type:'leaderboard',visible,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.selectQuiz=id=>socket.emit('host',{type:'select',id,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.saveKey=()=>{hostKey=document.querySelector('#key').value;sessionStorage.setItem('hostKey',hostKey);alert('Schlüssel gespeichert')};
window.previewSelfie=async input=>{const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte ein Foto auswählen');return}try{const bitmap=await createImageBitmap(file);const side=Math.min(bitmap.width,bitmap.height),canvas=document.createElement('canvas');canvas.width=canvas.height=160;const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,160,160);bitmap.close();selfieData=canvas.toDataURL('image/jpeg',.68);const preview=document.querySelector('#selfie-preview');if(preview){preview.src=selfieData;preview.hidden=false}const save=document.querySelector('#save-selfie');if(save)save.hidden=false}catch(e){alert('Foto konnte nicht verarbeitet werden')}};
window.saveSelfie=()=>{if(!selfieData)return;socket.emit('avatar',selfieData,r=>{if(r?.error)alert(r.error);else alert('Selfie gespeichert!')})};
window.join=()=>{const name=document.querySelector('#name')?.value||'';const code=document.querySelector('#profile-code')?.value||'';socket.emit('join',{name,id:myId,code,avatar:selfieData},r=>{if(r?.error)return alert(r.error);myId=r.id;profileCode=r.code||null;localStorage.setItem('kq-id',myId);render()})};
window.createProfile=()=>socket.emit('createProfile',{},r=>{if(r?.error)return alert(r.error);profileCode=r.code;render();alert('Dein persönlicher Spielercode: '+r.code+'\nBitte sicher aufbewahren!')});
window.deleteProfile=()=>{if(!profileCode||!confirm('Dein dauerhaftes Profil und seine Zuordnung in der Bestenliste wirklich löschen?'))return;socket.emit('deleteProfile',profileCode,r=>{if(r?.error)return alert(r.error);profileCode=null;render()})};
window.openStats=async()=>{statsOpen=true;const el=document.querySelector('#stats');if(!el)return;el.textContent='Lade Auswertung …';const r=await fetch('/api/stats',{headers:{'x-host-key':hostKey}});if(!r.ok){el.textContent='Für die private Auswertung muss der Server mit HOST_KEY gestartet und der Schlüssel oben eingetragen werden.';return}const data=await r.json();el.innerHTML='<p>Registrierte Spieler: '+data.registered+' · Gespielte Runden: '+data.rounds+' · Teilnahmen: '+data.participations+'</p>'+data.quizzes.map(q=>'<h3>'+esc(q.title)+' ('+q.rounds+' Runden)</h3><ol>'+q.top.slice(0,10).map(p=>'<li>'+esc(p.name)+' – '+p.score+' Punkte</li>').join('')+'</ol>').join('')+'<button onclick="downloadStats()">CSV herunterladen</button>'};
window.downloadStats=async()=>{const r=await fetch('/api/stats.csv',{headers:{'x-host-key':hostKey}});if(!r.ok)return alert('Export nicht erlaubt');const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='kayjuubee-auswertung.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
socket.on('connect',()=>{if(myId)socket.emit('join',{id:myId},r=>{if(r?.restored){profileCode=r.code||null;submitted=!!(state?.phase==='question'&&state?.myAnswered);render()}else if(r?.error){myId=null;localStorage.removeItem('kq-id');render()}})});
function questionUI(){const q=state.question;if(!q)return '';let input='';
if(q.type==='boolean')input='<div class="grid"><button class="option '+(chosen===true?'selected':'')+'" onclick="chosen=true;render()">Richtig</button><button class="option '+(chosen===false?'selected':'')+'" onclick="chosen=false;render()">Falsch</button></div>';
else if(q.type==='sudoku'){input='<div class="sudoku-board">'+q.grid.map((row,r)=>row.map((v,c)=>'<div class="sudoku-cell '+(r===1?'sudoku-bottom ':'')+(c===1?'sudoku-right':'')+'">'+(v?'<strong>'+v+'</strong>':view==='play'?'<input data-cell="'+r+'-'+c+'" type="number" min="1" max="4" inputmode="numeric" aria-label="Zeile '+(r+1)+' Spalte '+(c+1)+'">':'<span>?</span>')+'</div>').join('')).join('')+'</div>'}
else if(q.type==='order'){if(!Array.isArray(chosen))chosen=q.options.map((_,i)=>i);input=chosen.map((id,i)=>'<div class="panel">'+esc(q.options[id])+' <button onclick="move('+i+',-1)">↑</button> <button onclick="move('+i+',1)">↓</button></div>').join('')}
else if(q.type==='estimate'||q.type==='text')input='<input id="answer" '+(q.type==='estimate'?'type="number"':'type="text"')+' placeholder="Deine Antwort" value="'+esc(chosen??'')+'">';
else input=opts(q);
const pics=Array.isArray(q.images)&&q.images.length?'<div class="quiz-pictures">'+q.images.slice(0,2).filter(u=>typeof u==='string'&&/^https:\/\//.test(u)).map(u=>'<img src="'+esc(u)+'" alt="Rätselfoto" referrerpolicy="no-referrer">').join('')+'</div>':'';return '<div class="panel question-panel"><p class="muted">Frage '+(state.index+1)+' / '+state.total+'</p><h2>'+esc(q.text)+'</h2>'+pics+'<div class="timer" id="timer"></div>'+input+(view==='play'?'<p><button onclick="send()" '+(submitted?'disabled':'')+'>'+(submitted?'Antwort abgegeben':'Antwort senden')+'</button></p>':'')+'</div>'}
function render(){
 if(!state)return;
 document.body.className=view+'-view'+(state.kidsMode?' kids-mode':'');
 let html='<header class="brand-header"><img src="/logo-original.webp" onerror="this.onerror=null;this.src=&quot;/logo.svg&quot;" alt="KayJuuBee Eventmodule"></header>'+(state.kidsMode?'<div class="kids-banner">🌈 KAYJUUBEE KIDS QUIZ ⭐</div>':'');
 if(view==='host'){
 html+='<div class="panel"><h2>Spielleitung</h2><div class="mode-switch"><strong>🎮 Spielmodus:</strong> <button class="mode-button '+(!state.kidsMode?'active':'')+'" onclick="setKidsMode(false)">🧠 Standard</button> <button class="mode-button '+(state.kidsMode?'active':'')+'" onclick="setKidsMode(true)">🌈 Kinderquiz</button></div><p class="muted">'+(state.kidsMode?'Kinderquiz: einfache Fragen, längere Antwortzeit, 1000 Punkte pro richtiger Antwort.':'Standardquiz: 800 Punkte + bis zu 200 Zeitbonus.')+'</p><label>Quiz wählen: <select onchange="selectQuiz(this.value)" '+(state.kidsMode?'disabled':'')+'>'+state.quizzes.filter(q=>!state.kidsMode||q.id==='kinder').map(q=>'<option value="'+esc(q.id)+'" '+(q.id===state.quizId?'selected':'')+'>'+esc(q.title)+'</option>').join('')+'</select></label><p><button onclick="host(\'next\')">Nächste Frage / Start</button> <button onclick="host(\'reveal\')">Auflösen</button> <button onclick="if(confirm(\'Spiel zurücksetzen?\'))host(\'reset\')">Zurücksetzen</button></p><p><label><input type="checkbox" onchange="setLeaderboard(this.checked)" '+(state.leaderboardVisible?'checked':'')+'> Bestenliste auf Beamer und Smartphones anzeigen</label></p><p>Teilnehmer: '+state.players.length+' · Antworten: '+state.answered+'</p><p>Bildschirm: <a style="color:#8ce9fd" href="/screen" target="_blank">/screen öffnen</a></p><p><input id="key" placeholder="Optionaler HOST_KEY" value="'+esc(hostKey)+'"> <button onclick="saveKey()">Schlüssel speichern</button></p></div>';
 html+=state.question&&state.phase!=='lobby'?questionUI():'<div class="panel">Warte auf den Spielstart.</div>';
 html+='<div class="panel"><h2>📊 Langzeit-Auswertung</h2><p>Teilnahmen und ewige Bestenlisten je Quiz. Für den privaten Bericht HOST_KEY auf dem Server setzen.</p><button onclick="openStats()">Auswertung öffnen</button><div id="stats"></div></div><div class="panel"><h2>🏆 Rangliste</h2>'+ranking()+'</div><div class="panel"><h2>Quiz-Fragen bearbeiten</h2><p>JSON-Editor: komplette Quizsammlung bearbeiten und speichern.</p><button onclick="loadEditor()">Editor laden</button><div id="editor"></div></div>';
 }else if(view==='screen'){
 html+='<div class="screen-layout">';
 html+='<aside class="screen-side"><div class="panel"><h2>JETZT MITMACHEN!</h2><img src="/api/qr" alt="QR-Code zum Beitreten"><div class="join-steps"><div><span>1</span> QR-Code scannen</div><div><span>2</span> Namen eingeben</div><div><span>3</span> Los geht’s!</div></div><p>Teilnehmer: '+state.players.length+'</p></div></aside>';
 html+='<section class="screen-center"><div class="panel" style="min-height:0;margin-bottom:18px"><h2>'+esc(state.quizTitle)+'</h2></div>';
 if(state.phase==='question')html+=questionUI();
 else if(state.phase==='result')html+='<div class="panel"><h2>✅ Richtige Antwort</h2><div class="big">'+esc(Array.isArray(state.results?.correct)?(state.question.type==='sudoku'?state.results.correct.map(row=>row.join(' ')).join(' | '):state.results.correct.map(i=>state.question.options?.[i]??i).join(', ')):typeof state.results?.correct==='number'&&state.question.options?state.question.options[state.results.correct]:state.results?.correct)+'</div></div>';
 else if(state.phase==='finished')html+='<div class="panel"><h2>🏆 Quiz beendet</h2><p>Vielen Dank fürs Mitspielen!</p></div>';
 else html+='<div class="panel"><h2>Gleich geht es los!</h2><p>Jetzt per QR-Code anmelden.</p></div>';
 html+='</section><aside class="screen-side">';
 if(state.leaderboardVisible!==false)html+='<div class="panel"><h2>🏆 Bestenliste</h2>'+ranking()+'</div>';
 else html+='<div class="panel"><h2>🏆 Bestenliste</h2><p class="muted">Wird später eingeblendet</p></div>';
 html+='</aside></div>';
 }else{
 if(!myId||!state.players.some(p=>p.id===myId))html+='<div class="panel"><h2>Mitspielen</h2><p>Dein Name (für Gäste)</p><input id="name" placeholder="Dein Name" maxlength="35"><p>Optional: persönlicher Spielercode</p><input id="profile-code" placeholder="Spielercode eingeben" maxlength="12" autocomplete="off"><p class="muted">Ohne Code spielst du als Gast. Ein dauerhaftes Profil kannst du nach dem Beitritt freiwillig erstellen.</p><div class="selfie-form"><label class="selfie-label" for="selfie-file">📸 Selfie aufnehmen (freiwillig)</label><input id="selfie-file" type="file" accept="image/*" capture="user" onchange="previewSelfie(this)"><img id="selfie-preview" class="selfie-preview" alt="Dein Selfie" hidden><p class="muted">Du kannst auch ohne Foto mitspielen. Das Bild wird nur für diese Spielrunde verwendet.</p></div><button onclick="join()">Beitreten</button></div>';
 else{const me=state.players.find(p=>p.id===myId);html+='<div class="panel player-greeting">'+avatar(me)+' <span>Hallo <b>'+esc(me.name)+'</b> · '+me.score+' Punkte</span></div><div class="panel profile-panel"><h2>⭐ Mein Spielerprofil (freiwillig)</h2>'+(profileCode?'<p>Dein Spielercode: <strong class="profile-code">'+esc(profileCode)+'</strong></p><p class="muted">Bewahre ihn gut auf, um deine Erfolge bei zukünftigen Quizrunden weiterzusammeln.</p><button onclick="deleteProfile()">Profil löschen</button>':'<p>Erstelle einen Spielercode, wenn du deine Teilnahmen und Rekorde dauerhaft sammeln möchtest.</p><button onclick="createProfile()">Persönlichen Spielercode erstellen</button>')+'</div><div class="panel selfie-update"><label class="selfie-label" for="selfie-file">📸 Selfie aufnehmen oder ändern</label><input id="selfie-file" type="file" accept="image/*" capture="user" onchange="previewSelfie(this)"><img id="selfie-preview" class="selfie-preview" alt="Dein Selfie" hidden><button id="save-selfie" hidden onclick="saveSelfie()">Foto übernehmen</button></div>';
 if(state.phase==='question')html+=questionUI();
 else if(state.phase==='result')html+='<div class="panel"><h2>Frage beendet!</h2><p>Warte auf die nächste Runde.</p></div>';
 else if(state.phase==='finished')html+='<div class="panel"><h2>🏆 Quiz beendet!</h2>'+(state.leaderboardVisible?ranking():'<p>Danke fürs Mitspielen!</p>')+'</div>';
 else html+='<div class="panel"><h2>Du bist dabei!</h2><p>Warte auf den Start.</p></div>';
 }}
 app.innerHTML=html;updateTimer();
}
function updateTimer(){const t=document.querySelector('#timer');if(t&&state?.phase==='question')t.textContent='⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+' s'}
setInterval(updateTimer,250);
socket.on('state',s=>{const newQuestion=!state||s.index!==state.index||s.quizId!==state.quizId||s.phase==='lobby';if(newQuestion){chosen=null;submitted=false}state=s;const editing=document.activeElement?.id==='answer';if(!editing)render()});
window.loadEditor=async()=>{const data=await fetch('/api/quizzes').then(r=>r.json());document.querySelector('#editor').innerHTML='<textarea id="jsoneditor"></textarea><p><button onclick="saveEditor()">Quiz speichern</button></p>';document.querySelector('#jsoneditor').value=JSON.stringify(data,null,2)};
window.saveEditor=async()=>{try{const data=JSON.parse(document.querySelector('#jsoneditor').value);const r=await fetch('/api/quizzes',{method:'PUT',headers:{'Content-Type':'application/json','x-host-key':hostKey},body:JSON.stringify(data)});alert(r.ok?'Gespeichert!':'Fehler: '+r.status)}catch(e){alert(e.message)}};
</script></body></html>

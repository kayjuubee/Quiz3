<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KayJuuBee Quiz</title><style>
:root{font-family:system-ui,Arial;background:#10182d;color:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:24px}h1{color:#8ce9fd;font-size:clamp(30px,5vw,58px)}h2{font-size:clamp(23px,3vw,36px)}.panel{background:#1d2b46;border-radius:18px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}button,select,input,textarea{font:inherit;border-radius:12px;padding:13px;border:1px solid #64748b}button{background:#27c5e8;color:#071320;font-weight:700;cursor:pointer}button:disabled{opacity:.4}input,select,textarea{background:#f8fafc;color:#101828;max-width:100%}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#f8fafc}.selected{background:#ffd36e}.muted{color:#b4c5dc}.big{font-size:clamp(30px,7vw,90px);font-weight:800}.pill{display:inline-block;padding:8px 15px;background:#324968;border-radius:20px;margin:5px}img{max-width:100%;background:white;border-radius:12px}ol li{padding:7px}textarea{width:100%;height:260px;font-family:monospace;font-size:13px}.timer{font-size:30px;color:#ffda7b}#notice{color:#ffda7b}</style></head><body><main id="app"></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), view=location.pathname.slice(1)||'host', app=document.querySelector('#app');
let state=null,myId=localStorage.getItem('kq-id'),chosen=null,submitted=false,hostKey=sessionStorage.getItem('hostKey')||'',tick;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ranking=()=>'<ol>'+state.players.map(p=>'<li>'+esc(p.name)+' — <b>'+p.score+'</b> Punkte</li>').join('')+'</ol>';
const opts=q=>q.options?.map((o,i)=>'<button class="option '+((Array.isArray(chosen)?chosen.includes(i):chosen===i)?'selected':'')+'" onclick="choose('+i+')">'+esc(o)+'</button>').join('')||'';
window.choose=i=>{if(submitted)return;chosen=state.question.type==='multi'?(Array.isArray(chosen)?chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i]:[i]):i;render()};
window.move=(i,delta)=>{const arr=chosen;const j=i+delta;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];render()};
window.send=()=>{const q=state.question;if(['estimate','text'].includes(q.type))chosen=document.querySelector('#answer')?.value;if(q.type==='boolean')chosen=chosen===true||chosen===false?chosen:null;if(chosen===null||chosen===''||(Array.isArray(chosen)&&!chosen.length))return;socket.emit('answer',chosen,r=>{if(r?.ok){submitted=true;render()}})};
window.host=type=>socket.emit('host',{type,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.setLeaderboard=visible=>socket.emit('host',{type:'leaderboard',visible,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.selectQuiz=id=>socket.emit('host',{type:'select',id,key:hostKey},r=>{if(r?.error)alert(r.error)});
window.saveKey=()=>{hostKey=document.querySelector('#key').value;sessionStorage.setItem('hostKey',hostKey);alert('Schlüssel gespeichert')};
window.join=()=>{const name=document.querySelector('#name').value;socket.emit('join',{name,id:myId},r=>{if(r?.error)return alert(r.error);myId=r.id;localStorage.setItem('kq-id',myId);render()})};
function questionUI(){const q=state.question;if(!q)return '';let input='';
if(q.type==='boolean')input='<div class="grid"><button class="option '+(chosen===true?'selected':'')+'" onclick="chosen=true;render()">Richtig</button><button class="option '+(chosen===false?'selected':'')+'" onclick="chosen=false;render()">Falsch</button></div>';
else if(q.type==='order'){if(!Array.isArray(chosen))chosen=q.options.map((_,i)=>i);input=chosen.map((id,i)=>'<div class="panel">'+esc(q.options[id])+' <button onclick="move('+i+',-1)">↑</button> <button onclick="move('+i+',1)">↓</button></div>').join('')}
else if(q.type==='estimate'||q.type==='text')input='<input id="answer" '+(q.type==='estimate'?'type="number"':'type="text"')+' placeholder="Deine Antwort" value="'+esc(chosen??'')+'">';
else input=opts(q);
return '<div class="panel"><p class="muted">Frage '+(state.index+1)+' / '+state.total+'</p><h2>'+esc(q.text)+'</h2><div class="timer" id="timer"></div>'+input+(view==='play'?'<p><button onclick="send()" '+(submitted?'disabled':'')+'>'+(submitted?'Antwort abgegeben':'Antwort senden')+'</button></p>':'')+'</div>'}
function render(){
 if(!state)return;
 let html='<h1>🎉 KayJuuBee Quiz</h1>';
 if(view==='host'){
 html+='<div class="panel"><h2>Spielleitung</h2><label>Quiz wählen: <select onchange="selectQuiz(this.value)">'+state.quizzes.map(q=>'<option value="'+esc(q.id)+'" '+(q.id===state.quizId?'selected':'')+'>'+esc(q.title)+'</option>').join('')+'</select></label><p><button onclick="host(\'next\')">Nächste Frage / Start</button> <button onclick="host(\'reveal\')">Auflösen</button> <button onclick="if(confirm(\'Spiel zurücksetzen?\'))host(\'reset\')">Zurücksetzen</button></p><p><label><input type="checkbox" onchange="setLeaderboard(this.checked)" '+(state.leaderboardVisible?'checked':'')+'> Bestenliste auf Beamer und Smartphones anzeigen</label></p><p>Teilnehmer: '+state.players.length+' · Antworten: '+state.answered+'</p><p>Bildschirm: <a style="color:#8ce9fd" href="/screen" target="_blank">/screen öffnen</a></p><p><input id="key" placeholder="Optionaler HOST_KEY" value="'+esc(hostKey)+'"> <button onclick="saveKey()">Schlüssel speichern</button></p></div>';
 html+=state.question&&state.phase!=='lobby'?questionUI():'<div class="panel">Warte auf den Spielstart.</div>';
 html+='<div class="panel"><h2>Rangliste</h2>'+ranking()+'</div><div class="panel"><h2>Quiz-Fragen bearbeiten</h2><p>JSON-Editor: komplette Quizsammlung bearbeiten und speichern.</p><button onclick="loadEditor()">Editor laden</button><div id="editor"></div></div>';
 }else if(view==='screen'){
 html+='<div class="panel"><h2>'+esc(state.quizTitle)+'</h2><p>Mitmachen: QR-Code scannen und Namen eingeben</p><img src="/api/qr" width="260" alt="QR-Code zum Beitreten"></div>';
 if(state.phase==='question')html+=questionUI();
 if(state.phase==='result')html+='<div class="panel"><h2>Richtige Antwort</h2><div class="big">'+esc(Array.isArray(state.results?.correct)?state.results.correct.map(i=>state.question.options?.[i]??i).join(', '):typeof state.results?.correct==='number'&&state.question.options?state.question.options[state.results.correct]:state.results?.correct)+'</div></div>';
 if(state.phase==='finished'&&state.leaderboardVisible)html+='<div class="panel"><h2>🏆 Finale Rangliste</h2></div>';
 if(state.leaderboardVisible)html+='<div class="panel"><h2>Rangliste</h2>'+ranking()+'</div>';
 }else{
 if(!myId||!state.players.some(p=>p.id===myId))html+='<div class="panel"><h2>Mitspielen</h2><input id="name" placeholder="Dein Name" maxlength="35"> <button onclick="join()">Beitreten</button></div>';
 else{const me=state.players.find(p=>p.id===myId);html+='<div class="panel">Hallo <b>'+esc(me.name)+'</b> · '+me.score+' Punkte</div>';
 if(state.phase==='question')html+=questionUI();
 else if(state.phase==='result')html+='<div class="panel"><h2>Frage beendet!</h2><p>Warte auf die nächste Runde.</p></div>';
 else if(state.phase==='finished')html+='<div class="panel"><h2>🏆 Quiz beendet!</h2>'+(state.leaderboardVisible?ranking():'<p>Danke fürs Mitspielen!</p>')+'</div>';
 else html+='<div class="panel"><h2>Du bist dabei!</h2><p>Warte auf den Start.</p></div>';
 }}
 app.innerHTML=html;updateTimer();
}
function updateTimer(){const t=document.querySelector('#timer');if(t&&state?.phase==='question')t.textContent='⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+' s'}
setInterval(updateTimer,250);
socket.on('state',s=>{const newQuestion=!state||s.index!==state.index||s.quizId!==state.quizId||s.phase==='lobby';if(newQuestion){chosen=null;submitted=false}state=s;const editing=document.activeElement?.id==='answer';if(!editing)render()});
window.loadEditor=async()=>{const data=await fetch('/api/quizzes').then(r=>r.json());document.querySelector('#editor').innerHTML='<textarea id="jsoneditor"></textarea><p><button onclick="saveEditor()">Quiz speichern</button></p>';document.querySelector('#jsoneditor').value=JSON.stringify(data,null,2)};
window.saveEditor=async()=>{try{const data=JSON.parse(document.querySelector('#jsoneditor').value);const r=await fetch('/api/quizzes',{method:'PUT',headers:{'Content-Type':'application/json','x-host-key':hostKey},body:JSON.stringify(data)});alert(r.ok?'Gespeichert!':'Fehler: '+r.status)}catch(e){alert(e.message)}};
</script></body></html>
